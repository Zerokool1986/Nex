[package]
name = "nex-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nex-desktop"
path = "src/main.rs"

[dependencies]
nex-core = { path = "../nex-core" }
eframe = { version = "0.31", features = ["default_fonts", "wgpu"] }
egui = "0.31"
serde = { workspace = true }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
sha2 = "0.10"
egui-phosphor = "0.9.0"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
